# Dependency updates for dsh-stock-quotes.
#
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      lint-tooling:
        patterns:
          - '@eslint/*'
          - 'eslint*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
